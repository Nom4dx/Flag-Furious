[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "githappens-forensics-web"
version = "4.0.0"
description = "Standalone read-only web forensics for VM, Git, Slack, cache and history evidence"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
githappens-web = "picup_web.main:run"
githappens-case = "picup_web.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["picup_web", "picup_web.modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
