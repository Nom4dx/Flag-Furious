[project]
name = "forensic-hub"
version = "1.0.0"
description = "Local, modular asset analysis framework"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]


[tool.ruff]
line-length = 110
extend-exclude = ["app/vendor", "plugins/*/src", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]
ignore = ["E701", "E702"]
